id: type.principal
extends: type.base
description: "Container for a principal's local world — registry, types, personal scope, projects, and connectors."
role: container
fields:
  registry:
    type: scalar
    cardinality: one
    storage: registry.yaml
    description: "Authoritative type index for this principal."
  types:
    type: scalar
    cardinality: one
    storage: types/
    description: "Registered type definitions (type.yaml + README.md per type)."
  personal:
    type: type.personal
    cardinality: one
    storage: personal/
  projects:
    type: type.directory
    content_type: project
    cardinality: one
    storage: projects/
  connectors:
    type: scalar
    cardinality: one
    optional: true
    storage: connectors/
    description: "Optional connectors — external services, devices, MCP configs, and personal automations (not Jah protocol code)."
  knowledge_base:
    type: scalar
    cardinality: one
    optional: true
    storage: knowledge-base/
    description: "Curated knowledge index — see system/agent/knowledge_base.md"
